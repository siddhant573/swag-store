name: "kane-cli on pull requests"
description: "Answers @kane-cli comments on a pull request: reads what the person means through kane's converse endpoint, checks which tests the PR touches, runs them against the PR's build, and reports with evidence, a policy verdict and checks."
inputs:
  phase:
    description: >-
      "run": answer the comment (and sweep missed ones); impact and tests run here. A turn that ran
      tests leaves its result for "report", because the comment carries the evidence link and the
      pack is uploaded between the two steps. "report": post that result and complete the checks.
    required: false
    default: "run"
  github-token:
    description: "Token for reading the PR and writing kane's comments, reactions and checks (needs checks: write)"
    required: false
    default: ${{ github.token }}
  username:
    description: "TestMu / LambdaTest username (pass from secrets.LT_USERNAME)"
    required: true
  access-key:
    description: "TestMu / LambdaTest access key (pass from secrets.LT_ACCESS_KEY)"
    required: true
  converse-url:
    description: "Full URL of the converse endpoint, e.g. https://<controller>/v1/integration/github/converse"
    required: true
  mention:
    description: "The trigger word. The calling workflow's job-level `if` must test for the same word."
    required: false
    default: "@kane-cli"
  bot-login:
    description: "The login github-token comments and reacts as (kane's own comments and reactions are recognised by it). Change it when github-token is a GitHub App's or a user's token."
    required: false
    default: "github-actions[bot]"
  pipeline:
    description: "\"true\" runs impact and tests for real; \"false\" keeps phase 1's dry run (kane says what it would do)."
    required: false
    default: "true"
  kane-cli:
    description: "The kane-cli command prefix, split like a shell would (quotes, backslashes) but never run through one, e.g. `kane-cli` or `/path/tsx /path/kane-cli/src/index.tsx`."
    required: false
    default: "kane-cli"
  kane-env:
    description: "The TestMu environment kane-cli signs in to: prod or stage (login --env)."
    required: false
    default: "prod"
  pr-path:
    description: "Where the workflow checked out the PR head (refs/pull/<n>/head, fetch-depth 0), relative to the workspace."
    required: false
    default: "pr"
  artifact-id:
    description: "report phase: the evidence artifact's id (actions/upload-artifact's artifact-id output); empty when nothing was uploaded."
    required: false
    default: ""
outputs:
  evidence-path:
    description: "run phase: the sealed evidence pack of the turn that ran tests, for actions/upload-artifact; empty when nothing ran."
    value: ${{ steps.kane.outputs.evidence-path }}
  logs-path:
    description: "run phase: kane-cli's raw testrun NDJSON for that turn; empty when nothing ran."
    value: ${{ steps.kane.outputs.logs-path }}
runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: "20"
    - name: Install the action's dependencies
      shell: bash
      run: |
        if [ "${{ inputs.phase }}" = "report" ] && [ -d "$GITHUB_ACTION_PATH/node_modules/yaml" ]; then exit 0; fi
        npm ci --omit=dev --no-audit --no-fund --prefix "$GITHUB_ACTION_PATH"
    - name: kane-cli (${{ inputs.phase }})
      id: kane
      shell: bash
      env:
        KANE_PHASE: ${{ inputs.phase }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        LT_USERNAME: ${{ inputs.username }}
        LT_ACCESS_KEY: ${{ inputs.access-key }}
        KANE_CONVERSE_URL: ${{ inputs.converse-url }}
        KANE_MENTION: ${{ inputs.mention }}
        KANE_BOT_LOGIN: ${{ inputs.bot-login }}
        KANE_PIPELINE: ${{ inputs.pipeline }}
        KANE_CLI_CMD: ${{ inputs.kane-cli }}
        KANE_ENV: ${{ inputs.kane-env }}
        KANE_PR_PATH: ${{ inputs.pr-path }}
        KANE_ARTIFACT_ID: ${{ inputs.artifact-id }}
        KANE_STATE_DIR: ${{ runner.temp }}/kane-cli-github
      run: node "$GITHUB_ACTION_PATH/src/main.mjs"
    - name: Stop the PR's app; remove kane-cli's per-job login ($RUNNER_TEMP/kane-home)
      if: always() && inputs.phase == 'run'
      shell: bash
      env:
        KANE_PHASE: stop-app
        KANE_STATE_DIR: ${{ runner.temp }}/kane-cli-github
        GITHUB_TOKEN: ""
      run: node "$GITHUB_ACTION_PATH/src/main.mjs"
